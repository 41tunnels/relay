services:
  relay:
    image: ghcr.io/41tunnels/relay:latest
    container_name: relay
    restart: unless-stopped
    environment:
      RELAY_ADDR: ":8080"
      RELAY_METRICS_ADDR: ":9091"
      RELAY_TRUST_PROXY: "true"
      RELAY_LOG_FORMAT: "json"
      RELAY_MAX_PAIRS: "10000"
    ports:
      - 3849:8080 # reverse proxy fronts this
      - 3850:9091 # metrics: never public
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - "no-new-privileges:true"
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
